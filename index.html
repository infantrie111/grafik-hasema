<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gait Dashboard | Mobile</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* RESET */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            /* Fix untuk iOS Safari Landscape bar issue */
            height: 100dvh;
            background: #111827;
            overflow: hidden;
        }

        /* --- COMPACT SIDEBAR (240px Fixed) --- */
        #sidebar {
            width: 240px;
            min-width: 240px;
            background: #0f172a;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
            z-index: 20;
        }

        h2 {
            text-align: left;
            margin: 0;
            color: #f8fafc;
            font-size: 1rem;
            font-weight: 800;
            padding-bottom: 5px;
            border-bottom: 1px solid #334155;
            margin-bottom: 10px;
        }

        /* --- CONTROLS COMPACT --- */
        .group-box {
            background: #1e293b;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
        }

        .group-title {
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 5px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Compact Inputs */
        select {
            width: 100%;
            padding: 6px;
            /* Lebih tipis */
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 4px;
            font-size: 0.75rem;
            /* Font kecil */
            outline: none;
        }

        label {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-top: 8px;
            margin-bottom: 2px;
        }

        button {
            display: none;
        }

        /* Hide manual upload di mobile biar bersih */

        /* --- STATUS GRID (Tiny) --- */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 5px;
        }

        .status-item {
            font-size: 0.6rem;
            padding: 4px;
            border-radius: 3px;
            background: #0f172a;
            border: 1px solid #334155;
            text-align: center;
            color: #64748b;
        }

        .status-ok {
            color: #34d399;
            border-color: #065f46;
            background: #064e3b;
        }

        /* --- METRICS (Tiny Terminal) --- */
        #stats-box {
            background: #000;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 8px;
            font-family: 'Menlo', monospace;
            font-size: 0.65rem;
            line-height: 1.2;
            color: #34d399;
            white-space: pre;
            overflow-y: auto;
            flex-grow: 1;
            max-height: 100px;
            /* Batasi tinggi stats */
        }

        /* --- MAIN CONTENT (Full Space) --- */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: white;
            position: relative;
            /* No padding, full blast */
        }

        #plot-area {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        /* --- DRAGGABLE SVG DIAGRAMS --- */
        .diagram-box {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            /* Background transparan */
            border-radius: 12px;
            padding: 10px;
            /* Border removed */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            /* Soft shadow */
            cursor: move;
            user-select: none;
            z-index: 1000;
            display: none;
            /* Hidden by default */
            backdrop-filter: blur(4px);
            /* Efek kaca buram */
        }

        .diagram-box.active {
            display: block;
        }

        .diagram-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            color: #334155;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 4px;
        }

        .diagram-box svg {
            display: block;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <h2>LOWER LIMB EXOSKELETON</h2>
        <h2>TEKNIK MESIN UNDIP</h2>

        <div class="group-box">
            <div class="group-title">Status</div>
            <div class="status-grid">
                <div id="status-Normal_Py" class="status-item">Norm(Py)</div>
                <div id="status-Normal_Kin" class="status-item">Norm(Cam)</div>
                <div id="status-Exo_Py" class="status-item">Exo(Py)</div>
                <div id="status-Exo_Kin" class="status-item">Exo(Cam)</div>
            </div>
        </div>

        <div class="group-box">
            <div class="group-title">Control</div>
            <label>Mode</label>
            <select id="mode-select" onchange="updateSubMenu()">
                <option value="0">Control (PWM vs Force)</option>
                <option value="1">Bio: Normal (Py vs Kin)</option>
                <option value="2">Bio: Exo (Py vs Kin)</option>
                <option value="3">Cyclogram</option>
                <option value="5">Signal Diagnostics</option>
            </select>

            <label id="sub-label">Param</label>
            <select id="sub-select" onchange="drawPlot()"></select>
        </div>

        <div class="group-box" style="flex-grow: 1; display: flex; flex-direction: column; margin-bottom: 0;">
            <div class="group-title">Metrics</div>
            <div id="stats-box">Init...</div>
        </div>
    </div>

    <div id="main-content">
        <div id="plot-area"></div>

        <!-- SVG Diagram: Cyclogram (Hip + Knee angles) -->
        <div id="diagram-cyclogram" class="diagram-box" style="top: 60px; right: 20px;">
            <div class="diagram-title">Kinematic Model</div>
            <svg width="160" height="200" viewBox="0 0 160 200">
                <!-- Vertical Reference (dashed) -->
                <line x1="40" y1="20" x2="40" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3" />

                <!-- Segments -->
                <line x1="40" y1="40" x2="90" y2="90" stroke="#000" stroke-width="3.5" stroke-linecap="round" />
                <!-- Hip-Knee -->
                <line x1="90" y1="90" x2="60" y2="160" stroke="#000" stroke-width="3.5" stroke-linecap="round" />
                <!-- Knee-Ankle -->

                <!-- Arcs -->
                <!-- Hip Angle Arc (Correct Direction) -->
                <path d="M 40 70 Q 55 65, 60 55" stroke="#2563eb" stroke-width="2" fill="none" opacity="0.8" />

                <!-- Knee Angle Arc (Restored & Corrected) -->
                <!-- Kurva melengkung DI DALAM sudut lutut (Internal Angle) -->
                <!-- Menghubungkan titik di paha (80,80) ke titik di betis (84,104) -->
                <path d="M 80 80 Q 75 90, 84 104" stroke="#10b981" stroke-width="2" fill="none" opacity="0.8" />

                <!-- Joints -->
                <circle cx="40" cy="40" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
                <circle cx="90" cy="90" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
                <circle cx="60" cy="160" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5" />

                <!-- TEXT LABELS with Background Circle -->

                <!-- Theta 1 (Hip) -->
                <circle cx="65" cy="55" r="11" fill="white" fill-opacity="0.9" />
                <text x="65" y="60" font-size="16" font-weight="bold" font-style="italic" fill="#2563eb"
                    text-anchor="middle">θ₁</text>

                <!-- Theta 2 (Knee) -->
                <!-- Posisi di sebelah kiri lutut (area kosong) -->
                <circle cx="65" cy="95" r="11" fill="white" fill-opacity="0.9" />
                <text x="65" y="100" font-size="16" font-weight="bold" font-style="italic" fill="#10b981"
                    text-anchor="middle">θ₂</text>

                <!-- Part Labels -->
                <text x="10" y="45" font-size="12" font-weight="bold" fill="#333">Hip</text>
                <text x="100" y="95" font-size="12" font-weight="bold" fill="#333">Knee</text>
                <text x="65" y="175" font-size="12" font-weight="bold" fill="#333">Ankle</text>
                <text x="10" y="190" font-size="10" fill="#64748b">Vertical</text>
            </svg>
        </div>

        <!-- SVG Diagram: Knee-Cable (Simplifikasi Geometri) -->
        <div id="diagram-knee-cable" class="diagram-box" style="top: 60px; right: 20px;">
            <div class="diagram-title">Exo Mechanism</div>
            <svg width="160" height="200" viewBox="0 0 160 200">
                <!-- 1. Garis Referensi Vertikal (Dashed) -->
                <line x1="40" y1="40" x2="40" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" />
                <text x="35" y="190" font-size="10" fill="#64748b" font-style="italic">Vertical</text>

                <!-- 2. Garis Paha (Thigh Segment) -->
                <line x1="40" y1="40" x2="85" y2="130" stroke="#000" stroke-width="5" stroke-linecap="round" />

                <!-- Garis Betis (Shank Segment) - Vertikal ke bawah -->
                <line x1="85" y1="130" x2="85" y2="185" stroke="#000" stroke-width="5" stroke-linecap="round" />

                <!-- Knee Joint (Titik Merah di Lutut) -->
                <circle cx="85" cy="130" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
                <text x="95" y="135" font-size="11" font-weight="bold" fill="#333">Knee</text>

                <!-- Ankle Joint (Ujung Bawah) -->
                <circle cx="85" cy="185" r="4" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
                <text x="95" y="188" font-size="11" font-weight="bold" fill="#333">Ankle</text>

                <!-- 3. Titik Pivot (Pinggul/Hip) -->
                <circle cx="40" cy="40" r="6" fill="white" stroke="#000" stroke-width="2" />
                <text x="15" y="30" font-size="11" font-weight="bold" fill="#333">Hip</text>

                <!-- 4. Motor/Pulley (Hijau - SANGAT DEKAT pinggul) -->
                <!-- Digeser mendekat dari cx=90 ke cx=75 -->
                <circle cx="75" cy="40" r="12" fill="#10b981" stroke="#065f46" stroke-width="1" />
                <text x="75" y="25" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">Motor</text>

                <!-- 5. Kabel (Merah - Menarik Paha) -->
                <line x1="67" y1="45" x2="72" y2="108" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)" />
                <text x="95" y="80" font-size="11" font-weight="bold" fill="#ef4444">Cable</text>
                <!-- Titik kait kabel di paha -->
                <rect x="69" y="106" width="6" height="6" fill="#333" transform="rotate(-25 72 108)" />

                <!-- 6. Theta (Sudut Paha) -->
                <path d="M 40 90 Q 50 85, 55 70" stroke="#2563eb" stroke-width="2" fill="none" opacity="0.8" />

                <!-- Label Theta (Digeser ke Kiri Bawah Arc) -->
                <circle cx="45" cy="95" r="11" fill="white" fill-opacity="0.9" />
                <text x="45" y="100" font-size="16" font-weight="bold" font-style="italic" fill="#2563eb"
                    text-anchor="middle">θ</text>
            </svg>
        </div>
    </div>

    <script>
        let datasets = { Normal_Python: null, Normal_Kinovea: null, Exo_Python: null, Exo_Kinovea: null };
        const COLORS = { norm: '#10b981', exo: '#ef4444', sensor: '#2563eb', cam: '#f59e0b' };

        const AUTO_FILES = [
            { url: "FINAL_DATA_JALAN_NORMAL_Python.csv", key: "Normal_Python", label: "status-Normal_Py" },
            { url: "FINAL_DATA_JALAN_NORMAL_Kinovea.csv", key: "Normal_Kinovea", label: "status-Normal_Kin" },
            { url: "FINAL_DATA_EXOSKELETON_Python.csv", key: "Exo_Python", label: "status-Exo_Py" },
            { url: "FINAL_DATA_EXOSKELETON_kinovea.csv", key: "Exo_Kinovea", label: "status-Exo_Kin" }
        ];

        window.onload = function () {
            loadDefaultFiles();
            initDraggableDiagrams();
        };

        // === DRAGGABLE DIAGRAM FUNCTIONALITY ===
        function initDraggableDiagrams() {
            const diagrams = document.querySelectorAll('.diagram-box');

            diagrams.forEach(diagram => {
                let isDragging = false;
                let currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

                diagram.addEventListener('mousedown', dragStart);
                diagram.addEventListener('touchstart', dragStart);

                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag);

                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchend', dragEnd);

                function dragStart(e) {
                    if (e.type === 'touchstart') {
                        initialX = e.touches[0].clientX - xOffset;
                        initialY = e.touches[0].clientY - yOffset;
                    } else {
                        initialX = e.clientX - xOffset;
                        initialY = e.clientY - yOffset;
                    }

                    if (e.target === diagram || diagram.contains(e.target)) {
                        isDragging = true;
                    }
                }

                function drag(e) {
                    if (isDragging) {
                        e.preventDefault();

                        if (e.type === 'touchmove') {
                            currentX = e.touches[0].clientX - initialX;
                            currentY = e.touches[0].clientY - initialY;
                        } else {
                            currentX = e.clientX - initialX;
                            currentY = e.clientY - initialY;
                        }

                        xOffset = currentX;
                        yOffset = currentY;

                        setTranslate(currentX, currentY, diagram);
                    }
                }

                function dragEnd() {
                    isDragging = false;
                }

                function setTranslate(xPos, yPos, el) {
                    el.style.transform = `translate(${xPos}px, ${yPos}px)`;
                }
            });
        }

        // === DIAGRAM VISIBILITY CONTROL ===
        function updateDiagramVisibility(mode, sub) {
            const cyclogramDiagram = document.getElementById('diagram-cyclogram');
            const kneeCableDiagram = document.getElementById('diagram-knee-cable');

            // Hide all first
            cyclogramDiagram.classList.remove('active');
            kneeCableDiagram.classList.remove('active');

            // Show based on mode
            if (mode == "3") { // Cyclogram
                cyclogramDiagram.classList.add('active');
            } else if (mode == "5" && sub && sub.includes("Knee-Cable")) { // Knee-Cable Relation
                kneeCableDiagram.classList.add('active');
            }
        }


        function loadDefaultFiles() {
            let loadedCount = 0;
            AUTO_FILES.forEach(fileDef => {
                let el = document.getElementById(fileDef.label);
                Papa.parse(fileDef.url, {
                    download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
                    complete: function (results) {
                        if (results.data && results.data.length > 0) {
                            datasets[fileDef.key] = results.data;
                            el.className = "status-item status-ok";
                            loadedCount++;
                            if (loadedCount === AUTO_FILES.length) { updateStats(); drawPlot(); } else { drawPlot(); }
                        }
                    },
                    error: function () { el.innerText = "Err"; }
                });
            });
            updateSubMenu();
        }

        function updateSubMenu() {
            const mode = document.getElementById('mode-select').value;
            const sub = document.getElementById('sub-select');
            sub.innerHTML = '';
            if (mode == "0") addOptions(sub, ["Actuator Sync"]);
            else if (mode == "1" || mode == "2") addOptions(sub, ["Sumbu Vertikal", "Join Angle"]);
            else if (mode == "3") addOptions(sub, ["Normal Walking", "Exo Assisted"]);
            else if (mode == "5") addOptions(sub, ["Noise Check", "Knee Histogram", "Force Drift", "Force FFT", "PWM Digital Step", "Knee-Cable Relation"]);
            drawPlot();
        }

        function addOptions(select, options) {
            options.forEach(opt => { let el = document.createElement('option'); el.textContent = opt; el.value = opt; select.appendChild(el); });
        }

        function movingAverage(data, window) {
            let result = [];
            for (let i = 0; i < data.length; i++) {
                let start = Math.max(0, i - Math.floor(window / 2));
                let end = Math.min(data.length, i + Math.floor(window / 2));
                let sub = data.slice(start, end);
                result.push(sub.reduce((a, b) => a + b, 0) / sub.length);
            }
            return result;
        }

        // Simple DFT for visualization (sufficient for small gait datasets)
        function computeDFT(signal, dt) {
            const N = signal.length;
            const freqs = [];
            const mags = [];
            for (let k = 0; k < Math.floor(N / 2); k++) {
                let re = 0, im = 0;
                for (let n = 0; n < N; n++) {
                    const phi = (2 * Math.PI * k * n) / N;
                    re += signal[n] * Math.cos(phi);
                    im -= signal[n] * Math.sin(phi);
                }
                freqs.push(k / (N * dt));
                mags.push(Math.sqrt(re * re + im * im));
            }
            return { x: freqs, y: mags };
        }

        function updateStats() {
            let out = "";
            Object.keys(datasets).forEach(k => {
                if (datasets[k]) {
                    let d = datasets[k];
                    let kneeCol = d[0].hasOwnProperty('L_Knee') ? 'L_Knee' : (d[0].hasOwnProperty('Angle') ? 'Angle' : null);
                    if (kneeCol) {
                        let vals = d.map(r => r[kneeCol]);
                        let max = Math.max(...vals).toFixed(0);
                        let min = Math.min(...vals).toFixed(0);
                        // Short format for mobile
                        out += `${k.replace('Normal_', 'N_').replace('Exo_', 'E_').replace('Python', 'Py').replace('Kinovea', 'Cam')}: ${min}/${max}°\n`;
                    }
                }
            });
            document.getElementById('stats-box').innerText = out;
        }

        function drawPlot() {
            const mode = document.getElementById('mode-select').value;
            const sub = document.getElementById('sub-select').value;
            let dataPlot = [];

            // Update diagram visibility based on current mode
            updateDiagramVisibility(mode, sub);

            // --- STYLE SETTINGS FOR PPT/REPORT ---
            const fontBase = { family: '-apple-system, Arial', size: 14, color: '#000' };
            const fontTitle = { family: '-apple-system, Arial', size: 18, color: '#000', weight: 'bold' };
            const fontAxis = { family: '-apple-system, Arial', size: 16, weight: 'bold', color: '#000' };

            let layout = {
                margin: { t: 80, b: 60, l: 60, r: 20 },
                showlegend: true,
                dragmode: 'pan',
                legend: {
                    x: 0.02, y: 0.98,
                    xanchor: 'left', yanchor: 'top',
                    bgcolor: 'rgba(255,255,255,0.8)',
                    bordercolor: '#000',
                    borderwidth: 1,
                    font: { size: 14, color: '#000' }
                },
                xaxis: {
                    showgrid: true, gridcolor: '#e0e0e0',
                    showline: true, linewidth: 3, linecolor: '#000', mirror: true,
                    tickfont: { size: 14, weight: 'bold', color: '#000' },
                    titlefont: fontAxis
                },
                yaxis: {
                    showgrid: true, gridcolor: '#e0e0e0',
                    showline: true, linewidth: 3, linecolor: '#000', mirror: true,
                    tickfont: { size: 14, weight: 'bold', color: '#000' },
                    titlefont: fontAxis
                },
                hovermode: 'closest',
                title: { font: fontTitle, y: 0.95 },
                font: fontBase,
                paper_bgcolor: '#fff',
                plot_bgcolor: '#fff'
            };

            let config = {
                scrollZoom: true,
                responsive: true,
                displayModeBar: true,
                displaylogo: false,
                editable: true
            };

            if (mode == "0" && datasets.Exo_Python) {
                let d = datasets.Exo_Python;
                dataPlot.push({ x: d.map(r => r.Time), y: d.map(r => r.L_Force_kg), name: 'Force', line: { color: COLORS.norm, width: 3 } });

                dataPlot.push({ x: d.map(r => r.Time), y: d.map(r => r.L_PWM), name: 'PWM', line: { color: COLORS.sensor, dash: 'dot', width: 2.5 } });

                layout.yaxis.title = "Force (kg) & PWM";
                layout.xaxis.title = "Time (s)";
                layout.title = { text: "Force vs PWM", font: fontTitle, y: 0.95 };

                layout.yaxis.dtick = 20;
            }
            else if (mode == "1" || mode == "2") {
                let column = sub === "Join Angle" ? "L_Knee" : "L_Hip_Vert";
                let pyData = (mode == "1") ? datasets.Normal_Python : datasets.Exo_Python;
                let kinData = (mode == "1") ? datasets.Normal_Kinovea : datasets.Exo_Kinovea;

                let title = "";
                if (sub === "Sumbu Vertikal") title = "Sumbu Vertikal<br>(Orientasi Paha relatif Gravitasi)";
                else title = "Join Angle (Fleksi/Ekstensi Lutut)";

                if (pyData) {
                    let yRaw = pyData.map(r => r[column]);
                    let ySmooth = movingAverage(yRaw, 15);
                    dataPlot.push({ x: pyData.map(r => r.Time), y: ySmooth, name: 'Python Sensor', line: { color: COLORS.sensor, width: 3 } });
                }
                if (kinData) {
                    let kinCol = (sub === "Join Angle") ? (kinData[0].hasOwnProperty('L_Knee') ? 'L_Knee' : 'Angle') : 'L_Hip_Vert';
                    if (kinData[0] && (kinData[0][kinCol] !== undefined || (kinCol = 'Angle', kinData[0]['Angle'] !== undefined))) {
                        let yRawKin = kinData.map(r => r[kinCol]);
                        let ySmoothKin = movingAverage(yRawKin, 15);
                        dataPlot.push({
                            x: kinData.map(r => r.Time || (r.Frame ? r.Frame / 30 : null)),
                            y: ySmoothKin,
                            name: 'Kinovea (Cam)',
                            line: { color: COLORS.cam, width: 3 }
                        });
                    }
                }
                layout.title = { text: title, font: fontTitle, y: 0.95 };
                layout.xaxis.title = "Time (s)";
                layout.yaxis.title = "Angle (deg)";
                layout.yaxis.dtick = 5;
            }
            else if (mode == "3") {
                let d = sub === "Normal Walking" ? datasets.Normal_Python : datasets.Exo_Python;
                if (d) {
                    let xRaw = d.map(r => r.L_Knee);
                    let yRaw = d.map(r => r.L_Hip_Joint !== undefined ? r.L_Hip_Joint : (r.L_Hip_Vert || 0));

                    let xSmooth = movingAverage(xRaw, 10);
                    let ySmooth = movingAverage(yRaw, 10);

                    dataPlot.push({
                        x: xSmooth,
                        y: ySmooth,
                        mode: 'lines',
                        name: 'Cycle',
                        line: { color: sub === "Normal Walking" ? COLORS.norm : '#2563eb', width: 4 }
                    });

                    if (xSmooth.length > 0) {
                        dataPlot.push({
                            x: [xSmooth[0]],
                            y: [ySmooth[0]],
                            mode: 'markers',
                            name: 'Start',
                            marker: { color: '#FFFF00', size: 16, symbol: 'circle', line: { color: 'black', width: 2 } }
                        });

                        dataPlot.push({
                            x: [xSmooth[xSmooth.length - 1]],
                            y: [ySmooth[ySmooth.length - 1]],
                            mode: 'markers',
                            name: 'End',
                            marker: { color: '#ef4444', size: 16, symbol: 'x', line: { color: 'black', width: 2 } }
                        });
                    }

                    layout.title = { text: "Cyclogram: " + sub, font: fontTitle, y: 0.95 };
                    layout.xaxis.title = "Knee Angle (deg)";
                    layout.yaxis.title = "Hip Angle (deg)";

                    layout.yaxis.dtick = 5;

                    // Old annotation removed - now using SVG overlay diagram
                }
            }
            else if (mode == "5") {
                let d = datasets.Exo_Python || datasets.Normal_Python;
                if (!d) return;

                layout.xaxis.showline = true;
                layout.yaxis.showline = true;

                if (sub.includes("Noise")) {
                    let raw = d.map(r => r.L_Knee);
                    let filtered = movingAverage(raw, 8);
                    dataPlot.push({ y: raw, name: 'Raw', line: { color: '#64748b', width: 1 } });
                    dataPlot.push({ y: filtered, name: 'Filter', line: { color: '#8b5cf6', width: 2 } });
                    layout.title = { text: "Noise Check", font: fontTitle, y: 0.95 };
                    layout.yaxis.title = "Angle (deg)";
                    layout.xaxis.title = "Time (s)";
                    layout.yaxis.dtick = 5;
                }
                else if (sub.includes("Histogram")) {
                    dataPlot.push({ x: d.map(r => r.L_Knee), type: 'histogram', name: 'Dist.' });
                    layout.title = { text: "Knee Histogram", font: fontTitle, y: 0.95 };
                    layout.xaxis.title = "Angle (deg)";
                    layout.yaxis.title = "Count";
                    layout.xaxis.dtick = 5;
                }
                else if (sub.includes("Force Drift")) {
                    let force = d.map(r => r.L_Force_kg);
                    dataPlot.push({ y: force, name: 'Force', fill: 'tozeroy' });
                    layout.title = { text: "Force Drift", font: fontTitle, y: 0.95 };
                    layout.yaxis.title = "Force (kg)";
                    layout.xaxis.title = "Sample";
                    layout.yaxis.dtick = 20;
                }
                // --- NEW DIAGNOSTICS ---
                else if (sub.includes("FFT")) {
                    let force = d.map(r => r.L_Force_kg);
                    let dt = (d.length > 1) ? (d[1].Time - d[0].Time) : 0.02;
                    if (!dt || dt < 0) dt = 0.02;
                    let res = computeDFT(force, dt);
                    dataPlot.push({ x: res.x, y: res.y, type: 'scatter', mode: 'lines', name: 'Magnitude', line: { color: '#000', width: 2 } });
                    layout.title = { text: "Force FFT", font: fontTitle, y: 0.95 };
                    layout.xaxis.title = "Frequency (Hz)";
                    layout.yaxis.title = "Magnitude";
                    layout.xaxis.range = [0, 25];
                }
                else if (sub.includes("PWM Digital")) {
                    let pwm = d.map(r => r.L_PWM);
                    dataPlot.push({ x: d.map(r => r.Time), y: pwm, type: 'scatter', mode: 'lines', line: { shape: 'hv', width: 2, color: COLORS.sensor }, name: 'PWM Step' });
                    layout.title = { text: "PWM Digital Step", font: fontTitle, y: 0.95 };
                    layout.xaxis.title = "Time (s)";
                    layout.yaxis.title = "PWM Value";
                    layout.yaxis.dtick = 20;
                }
                // --- KNEE-CABLE RELATION (SCATTER PLOT) ---
                else if (sub.includes("Knee-Cable")) {
                    const PULLEY_RADIUS = 0.0127; // meters
                    let kneeAngle = d.map(r => r.L_Knee);
                    // Calculate cable displacement: d = r × θ (rad) = r × (θ_deg × π/180)
                    let cableDisp = kneeAngle.map(angle => PULLEY_RADIUS * angle * Math.PI / 180 * 100); // Convert to cm

                    dataPlot.push({
                        x: kneeAngle,
                        y: cableDisp,
                        mode: 'markers',
                        name: 'Data Points',
                        marker: {
                            color: kneeAngle,
                            colorscale: 'Viridis', // Gradasi warna keren (Biru-Hijau-Kuning)
                            size: 8,
                            showscale: true,
                            colorbar: {
                                title: 'Angle Intensity',
                                titleside: 'right'
                            }
                        }
                    });

                    // Add a subtle area fill to emphasize the linear progression
                    dataPlot.push({
                        x: [Math.min(...kneeAngle), Math.max(...kneeAngle)],
                        y: [Math.min(...cableDisp), Math.max(...cableDisp)],
                        mode: 'lines',
                        name: 'Linear Trend',
                        line: { color: 'rgba(0,0,0,0.2)', width: 1, dash: 'dot' },
                        fill: 'tozeroy',
                        fillcolor: 'rgba(37, 99, 235, 0.1)' // Soft blue fill under the line
                    });

                    layout.xaxis.title = "Knee Angle (deg)";
                    layout.yaxis.title = "Cable Displacement (cm)";
                    layout.title = { text: "Cable Displacement vs Knee Angle", font: fontTitle, y: 0.95 };
                    layout.xaxis.dtick = 5;
                    layout.yaxis.dtick = 0.2;

                    // --- PULLEY MODEL DIAGRAM (Draggable Box) ---
                    // Annotation handled by SVG Overlay (diagram-knee-cable)
                }
            }
            Plotly.newPlot('plot-area', dataPlot, layout, config);
        }
    </script>
</body>
