<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gait Dashboard | Mobile</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* RESET */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            /* Fix untuk iOS Safari Landscape bar issue */
            height: 100dvh;
            background: #111827;
            overflow: hidden;
        }

        /* --- COMPACT SIDEBAR (240px Fixed) --- */
        #sidebar {
            width: 240px;
            min-width: 240px;
            background: #0f172a;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
            z-index: 20;
        }

        h2 {
            text-align: left;
            margin: 0;
            color: #f8fafc;
            font-size: 1rem;
            font-weight: 800;
            padding-bottom: 5px;
            border-bottom: 1px solid #334155;
            margin-bottom: 10px;
        }

        /* --- CONTROLS COMPACT --- */
        .group-box {
            background: #1e293b;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
        }

        .group-title {
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 5px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Compact Inputs */
        select {
            width: 100%;
            padding: 6px;
            /* Lebih tipis */
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 4px;
            font-size: 0.75rem;
            /* Font kecil */
            outline: none;
        }

        label {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-top: 8px;
            margin-bottom: 2px;
        }

        button {
            display: none;
        }

        /* Hide manual upload di mobile biar bersih */

        /* --- STATUS GRID (Tiny) --- */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 5px;
        }

        .status-item {
            font-size: 0.6rem;
            padding: 4px;
            border-radius: 3px;
            background: #0f172a;
            border: 1px solid #334155;
            text-align: center;
            color: #64748b;
        }

        .status-ok {
            color: #34d399;
            border-color: #065f46;
            background: #064e3b;
        }

        /* --- METRICS (Tiny Terminal) --- */
        #stats-box {
            background: #000;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 8px;
            font-family: 'Menlo', monospace;
            font-size: 0.65rem;
            line-height: 1.2;
            color: #34d399;
            white-space: pre;
            overflow-y: auto;
            flex-grow: 1;
            max-height: 100px;
            /* Batasi tinggi stats */
        }

        /* --- MAIN CONTENT (Full Space) --- */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: white;
            position: relative;
            /* No padding, full blast */
        }

        #plot-area {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        /* --- DRAGGABLE SVG DIAGRAMS --- */
        .diagram-box {
            position: absolute;
            background: transparent;
            /* Fully transparent - no background */
            padding: 8px;
            /* Add padding to prevent text clipping */
            cursor: move;
            user-select: none;
            z-index: 1000;
            display: none;
            /* Hidden by default */
            overflow: visible;
            /* Allow content to be fully visible */
        }

        .diagram-box.active {
            display: block;
        }

        .diagram-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            color: #1e293b;
            /* Darker color for better visibility on transparent bg */
            padding: 4px 8px;
            /* Add horizontal padding to prevent text clipping */
            background: rgba(255, 255, 255, 0.9);
            /* Semi-transparent white bg for title readability */
            border-radius: 6px;
        }

        .diagram-box svg {
            display: block;
            transform: scale(1.3);
            /* Zoom in the kinematic model */
            transform-origin: top center;
            /* Grow downwards */
            overflow: visible;
            /* Allow labels (Cable, Ankle) to flow outside viewBox */
        }

        /* --- FULLSCREEN / REPORT MODE --- */
        body.fullscreen-mode #sidebar {
            display: none;
            /* Hide sidebar */
        }

        body.fullscreen-mode .diagram-box {
            transform: scale(2.2);
            /* Perbesar Diagram Skematik LEBIH BESAR LAGI */
            transform-origin: top right;
            top: 120px !important;
            /* Turunkan sedikit biar ga nabrak judul */
            right: 60px !important;
        }

        /* Tombol Maximize di Pojok Kanan Atas */
        #btn-maximize {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 2000;
            background: rgba(255, 255, 255, 0.92);
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            color: #334155;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            display: flex !important;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        #btn-maximize:hover {
            background: #f1f5f9;
            color: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* --- Toggle Diagram Button (Hidden on Desktop) --- */
        #btn-toggle-diagram {
            position: absolute;
            top: 12px;
            right: 130px;  /* sits left of #btn-maximize */
            z-index: 2000;
            background: rgba(255, 255, 255, 0.92);
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            color: #334155;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            display: none !important;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        #btn-toggle-diagram:hover {
            background: #f1f5f9;
            color: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* ========== ORIENTATION OVERLAY (Portrait Block) ========== */
        #orientation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 24px;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #orientation-overlay .rotate-icon {
            font-size: 4rem;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        #orientation-overlay .rotate-text {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            padding: 0 20px;
        }

        #orientation-overlay .rotate-sub {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }

        @keyframes rotatePhone {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-30deg); }
            75% { transform: rotate(90deg); }
        }

        /* Show overlay ONLY on small screens in portrait */
        @media (max-width: 932px) and (orientation: portrait) {
            #orientation-overlay {
                display: flex !important;
            }
        }

        /* ========== MOBILE RESPONSIVE (< 932px) ========== */
        @media (max-width: 932px) {
            body {
                flex-direction: column;
            }

            #sidebar {
                width: 100%;
                min-width: 100%;
                height: auto;
                max-height: 40vh;
                border-right: none;
                border-bottom: 2px solid #1e293b;
            }

            #main-content {
                height: 60vh;
                width: 100%;
            }

            /* Compact button sizing on mobile */
            #btn-maximize {
                padding: 4px 8px !important;
                font-size: 0.7rem !important;
                top: 8px !important;
                right: 8px !important;
            }

            /* Toggle Diagram button: hidden by default, shown via .show-on-mobile */
            #btn-toggle-diagram {
                display: none !important;
                padding: 4px 8px !important;
                font-size: 0.7rem !important;
                top: 8px !important;
                right: 100px !important;
            }

            #btn-toggle-diagram.show-on-mobile {
                display: block !important;
            }

            /* Hide diagram overlays on mobile by default */
            .diagram-box.active {
                display: none !important;
            }

            /* Show diagram when body has .mobile-diagram-visible.
               Use top/left set by drag JS; scale via transform only (no translate). */
            body.mobile-diagram-visible .diagram-box.active {
                display: block !important;
                transform: scale(0.55) !important;
                transform-origin: top right;
            }
        }

        /* ========== MOBILE LANDSCAPE OPTIMIZATION ========== */
        @media (max-width: 932px) and (orientation: landscape) {
            body {
                flex-direction: row !important;
            }

            #sidebar {
                width: 180px !important;
                min-width: 180px !important;
                max-height: 100vh !important;
                height: 100vh !important;
                border-right: 1px solid #1e293b !important;
                border-bottom: none !important;
            }

            #main-content {
                height: 100vh !important;
                width: calc(100% - 180px) !important;
                flex-grow: 1;
            }

            #sidebar h2 {
                font-size: 0.75rem;
            }

            #sidebar .group-title {
                font-size: 0.55rem;
            }

            #sidebar select {
                font-size: 0.65rem;
                padding: 4px;
            }

            #sidebar label {
                font-size: 0.55rem;
            }

            #sidebar .status-item {
                font-size: 0.5rem;
                padding: 2px;
            }

            #stats-box {
                font-size: 0.55rem;
                max-height: 60px;
            }
        }
    </style>
</head>

<body>

    <!-- ORIENTATION OVERLAY: Forces landscape on mobile -->
    <div id="orientation-overlay">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">Rotate Your Device to Landscape</div>
        <div class="rotate-sub">Charts are optimized for landscape viewing</div>
    </div>

    <div id="sidebar">
        <h2>LOWER LIMB EXOSKELETON</h2>
        <h2>TEKNIK MESIN UNDIP</h2>

        <div class="group-box">
            <div class="group-title">Status</div>
            <div class="status-grid">
                <div id="status-Normal_Py" class="status-item">Norm(Py)</div>
                <div id="status-Normal_Kin" class="status-item">Norm(Cam)</div>
                <div id="status-Exo_Py" class="status-item">Exo(Py)</div>
                <div id="status-Exo_Kin" class="status-item">Exo(Cam)</div>
                <div id="status-Hemi_PySV" class="status-item">Hemi(Py-SV)</div>
                <div id="status-Hemi_PyJA" class="status-item">Hemi(Py-JA)</div>
                <div id="status-Hemi_Kin" class="status-item">Hemi(Cam)</div>
            </div>
        </div>

        <div class="group-box">
            <div class="group-title">Control</div>
            <label>Mode</label>
            <select id="mode-select" onchange="updateSubMenu()">
                <option value="0">Control (PWM vs Force)</option>
                <option value="1">Bio: Normal (Py vs Kin)</option>
                <option value="2">Bio: Exo (Py vs Kin)</option>
                <option value="4">Bio: Comparison (Normal vs Exo)</option>
                <option value="7">Penderita hemiplegia</option>
                <option value="8">Comparasi Normal vs Penderita hemiplegia</option>
                <option value="3">Cyclogram</option>
                <option value="6">Body Trajectory</option>
                <option value="5">Signal Diagnostics</option>
            </select>

            <label id="sub-label">Param</label>
            <select id="sub-select" onchange="drawPlot()"></select>
        </div>

        <div class="group-box" style="flex-grow: 1; display: flex; flex-direction: column; margin-bottom: 0;">
            <div class="group-title">Metrics</div>
            <div id="stats-box">Init...</div>
        </div>
    </div>

    <div id="main-content">
        <button id="btn-maximize" onclick="toggleFullScreen()">⤢ Maximize</button>
        <button id="btn-toggle-diagram" onclick="toggleMobileDiagram()">🧍 Show Diagram</button>
        <div id="plot-area"></div>

        <!-- SVG Diagram: Cyclogram (Hip + Knee angles) -->
        <div id="diagram-cyclogram" class="diagram-box" style="top: 80px; right: 20px; width: 140px;">
            <!-- Title Removed -->
            <!-- Optimized viewBox to fit content tightly (Crop whitespace) -->
            <svg width="100%" height="100%" viewBox="0 20 130 180">
                <!-- Vertical Reference (dashed) -->
                <line x1="40" y1="20" x2="40" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3" />

                <!-- Segments -->
                <line x1="40" y1="40" x2="90" y2="90" stroke="#000" stroke-width="3.5" stroke-linecap="round" />
                <!-- Hip-Knee -->
                <line x1="90" y1="90" x2="60" y2="160" stroke="#000" stroke-width="3.5" stroke-linecap="round" />
                <!-- Knee-Ankle -->

                <!-- Arcs -->
                <!-- Hip Angle Arc (Correct Direction) -->
                <path d="M 40 70 Q 55 65, 60 55" stroke="#2563eb" stroke-width="2" fill="none" opacity="0.8" />

                <!-- Knee Angle Arc (Restored & Corrected) -->
                <!-- Kurva melengkung DI DALAM sudut lutut (Internal Angle) -->
                <!-- Menghubungkan titik di paha (80,80) ke titik di betis (84,104) -->
                <path d="M 80 80 Q 75 90, 84 104" stroke="#10b981" stroke-width="2" fill="none" opacity="0.8" />

                <!-- Joints -->
                <circle cx="40" cy="40" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
                <circle cx="90" cy="90" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
                <circle cx="60" cy="160" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5" />

                <!-- TEXT LABELS with Background Circle -->

                <!-- Theta 1 (Hip) -->
                <circle cx="65" cy="55" r="11" fill="white" fill-opacity="0.9" />
                <text x="65" y="60" font-size="16" font-weight="bold" font-style="italic" fill="#2563eb"
                    text-anchor="middle">θ₁</text>

                <!-- Theta 2 (Knee) -->
                <!-- Posisi di sebelah kiri lutut (area kosong) -->
                <circle cx="65" cy="95" r="11" fill="white" fill-opacity="0.9" />
                <text x="65" y="100" font-size="16" font-weight="bold" font-style="italic" fill="#10b981"
                    text-anchor="middle">θ₂</text>

                <!-- Part Labels -->
                <text x="10" y="45" font-size="12" font-weight="bold" fill="#333">Hip</text>
                <text x="100" y="95" font-size="12" font-weight="bold" fill="#333">Knee</text>
                <text x="65" y="175" font-size="12" font-weight="bold" fill="#333">Ankle</text>
                <text x="10" y="190" font-size="10" fill="#64748b">Vertical</text>
            </svg>
        </div>

        <!-- SVG Diagram: Knee-Cable (Simplifikasi Geometri) -->
        <div id="diagram-knee-cable" class="diagram-box" style="top: 80px; right: 20px; width: 140px;">
            <!-- Title Removed -->
            <!-- Optimized viewBox to fit content tightly -->
            <svg width="100%" height="100%" viewBox="10 10 110 190">
                <!-- 1. Garis Referensi Vertikal (Dashed) -->
                <line x1="40" y1="40" x2="40" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" />
                <text x="35" y="190" font-size="10" fill="#64748b" font-style="italic">Vertical</text>

                <!-- 2. Garis Paha (Thigh Segment) -->
                <line x1="40" y1="40" x2="85" y2="130" stroke="#000" stroke-width="5" stroke-linecap="round" />

                <!-- Garis Betis (Shank Segment) - Vertikal ke bawah -->
                <line x1="85" y1="130" x2="85" y2="185" stroke="#000" stroke-width="5" stroke-linecap="round" />

                <!-- Knee Joint (Titik Merah di Lutut) -->
                <circle cx="85" cy="130" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
                <text x="95" y="135" font-size="11" font-weight="bold" fill="#333">Knee</text>

                <!-- Ankle Joint (Ujung Bawah) -->
                <circle cx="85" cy="185" r="4" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
                <text x="95" y="188" font-size="11" font-weight="bold" fill="#333">Ankle</text>

                <!-- 3. Titik Pivot (Pinggul/Hip) -->
                <circle cx="40" cy="40" r="6" fill="white" stroke="#000" stroke-width="2" />
                <text x="15" y="30" font-size="11" font-weight="bold" fill="#333">Hip</text>

                <!-- 4. Motor/Pulley (Hijau - SANGAT DEKAT pinggul) -->
                <!-- Digeser mendekat dari cx=90 ke cx=75 -->
                <circle cx="75" cy="40" r="12" fill="#10b981" stroke="#065f46" stroke-width="1" />
                <text x="75" y="25" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">Motor</text>

                <!-- 5. Kabel (Merah - Menarik Paha) -->
                <line x1="67" y1="45" x2="72" y2="108" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)" />
                <text x="95" y="80" font-size="11" font-weight="bold" fill="#ef4444">Cable</text>
                <!-- Titik kait kabel di paha -->
                <rect x="69" y="106" width="6" height="6" fill="#333" transform="rotate(-25 72 108)" />

                <!-- 6. Theta (Sudut Paha) -->
                <path d="M 40 90 Q 50 85, 55 70" stroke="#2563eb" stroke-width="2" fill="none" opacity="0.8" />

                <!-- Label Theta (Digeser ke Kiri Bawah Arc) -->
                <circle cx="45" cy="95" r="11" fill="white" fill-opacity="0.9" />
                <text x="45" y="100" font-size="16" font-weight="bold" font-style="italic" fill="#2563eb"
                    text-anchor="middle">θ</text>
            </svg>
        </div>
    </div>

    <script>
        let datasets = { Normal_Python: null, Normal_Kinovea: null, Exo_Python: null, Exo_Kinovea: null, Hemi_Python_SV: null, Hemi_Python_JA: null, Hemi_Kinovea: null };
        const COLORS = { norm: '#10b981', exo: '#ef4444', sensor: '#2563eb', cam: '#f59e0b', hemi: '#a855f7', hemi2: '#f97316' };

        const AUTO_FILES = [
            { url: "FINAL_DATA_JALAN_NORMAL_Python.csv", key: "Normal_Python", label: "status-Normal_Py" },
            { url: "FINAL_DATA_JALAN_NORMAL_Kinovea.csv", key: "Normal_Kinovea", label: "status-Normal_Kin" },
            { url: "FINAL_DATA_EXOSKELETON_Python.csv", key: "Exo_Python", label: "status-Exo_Py" },
            { url: "FINAL_DATA_EXOSKELETON_kinovea.csv", key: "Exo_Kinovea", label: "status-Exo_Kin" },
            { url: "HEMIPLEGIA TRACKING Python_Sumbu Vertical.csv", key: "Hemi_Python_SV", label: "status-Hemi_PySV", delimiter: "," },
            { url: "HEMIPLEGIA TRACKING Python_SUDUT ANATOMI (Joint Angle).csv", key: "Hemi_Python_JA", label: "status-Hemi_PyJA", delimiter: "," },
            { url: "HEMIPLEGIA TRACKING Kinovea.csv", key: "Hemi_Kinovea", label: "status-Hemi_Kin", delimiter: ";" }
        ];

        window.onload = function () {
            loadDefaultFiles();
            initDraggableDiagrams();
        };

        // === FULLSCREEN / REPORT MODE LOGIC ===
        function toggleFullScreen() {
            document.body.classList.toggle('fullscreen-mode');
            const btn = document.getElementById('btn-maximize');
            const isMax = document.body.classList.contains('fullscreen-mode');

            if (isMax) {
                btn.innerHTML = "⤡ Exit Maximize";
                // Request browser fullscreen for total immersion (optional)
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => { });
                }
            } else {
                btn.innerHTML = "⤢ Maximize";
                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen().catch(err => { });
                }
            }

            // Force redraw plot to apply new font sizes
            drawPlot();

            // Trigger Plotly Resize to fill new space
            setTimeout(() => {
                Plotly.Plots.resize(document.getElementById('plot-area'));
            }, 100);
        }

        // === DRAGGABLE DIAGRAM FUNCTIONALITY ===
        // Uses top/left pixel positioning so mobile CSS scale(0.55) doesn't fight translate.
        function initDraggableDiagrams() {
            const diagrams = document.querySelectorAll('.diagram-box');

            diagrams.forEach(diagram => {
                let isDragging = false;
                let startMouseX, startMouseY, startLeft, startTop;

                diagram.addEventListener('mousedown', dragStart);
                diagram.addEventListener('touchstart', dragStart, { passive: false });

                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });

                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchend', dragEnd);

                function getClientXY(e) {
                    return e.touches
                        ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
                        : { x: e.clientX, y: e.clientY };
                }

                function dragStart(e) {
                    if (!(e.target === diagram || diagram.contains(e.target))) return;
                    const { x, y } = getClientXY(e);
                    startMouseX = x;
                    startMouseY = y;
                    // Read current top/left (px) from inline style or computed
                    startLeft = parseInt(diagram.style.left) || diagram.offsetLeft;
                    startTop  = parseInt(diagram.style.top)  || diagram.offsetTop;
                    isDragging = true;
                    e.preventDefault();
                }

                function drag(e) {
                    if (!isDragging) return;
                    e.preventDefault();
                    const { x, y } = getClientXY(e);
                    const dx = x - startMouseX;
                    const dy = y - startMouseY;
                    diagram.style.left   = (startLeft + dx) + 'px';
                    diagram.style.top    = (startTop  + dy) + 'px';
                    diagram.style.right  = 'auto';
                    diagram.style.bottom = 'auto';
                }

                function dragEnd() {
                    isDragging = false;
                }
            });
        }

        // === DIAGRAM VISIBILITY CONTROL ===
        function updateDiagramVisibility(mode, sub) {
            const cyclogramDiagram = document.getElementById('diagram-cyclogram');
            const kneeCableDiagram = document.getElementById('diagram-knee-cable');
            const toggleBtn = document.getElementById('btn-toggle-diagram');

            // Hide all first
            cyclogramDiagram.classList.remove('active');
            kneeCableDiagram.classList.remove('active');

            let diagramNeeded = false;

            // Show based on mode
            if (mode == "3") { // Cyclogram
                cyclogramDiagram.classList.add('active');
                diagramNeeded = true;
            } else if (mode == "5" && sub && sub.includes("Knee-Cable")) { // Knee-Cable Relation

        function movingAverage(data, window) {
            let result = [];
            for (let i = 0; i < data.length; i++) {
                let start = Math.max(0, i - Math.floor(window / 2));
                let end = Math.min(data.length, i + Math.floor(window / 2));
                let sub = data.slice(start, end);
                result.push(sub.reduce((a, b) => a + b, 0) / sub.length);
            }
            return result;
        }

        // Simple DFT for visualization (sufficient for small gait datasets)
        function computeDFT(signal, dt) {
            const N = signal.length;
            const freqs = [];
            const mags = [];
            for (let k = 0; k < Math.floor(N / 2); k++) {
                let re = 0, im = 0;
                for (let n = 0; n < N; n++) {
                    const phi = (2 * Math.PI * k * n) / N;
                    re += signal[n] * Math.cos(phi);
                    im -= signal[n] * Math.sin(phi);
                }
                freqs.push(k / (N * dt));
                mags.push(Math.sqrt(re * re + im * im));
            }
            return { x: freqs, y: mags };
        }

            // FUNGSI KOREKSI KINOVEA (Agar pola gait match dengan Python Sensor)
            // Kinovea biasanya baca 180 saat lurus, Sensor baca 0.
            // Kita coba koreksi: 180 - Value
            function correctKinovea(val, type) {
                if (val === undefined || val === null) return 0;
                // KEMBALI KE RAW DATA (Ternyata data user sudah benar 0-60, tidak perlu inversi)
                return val;
            }

            // === SHARED HELPER: Full Kinovea Normalization to Python Convention ===
            // Performs THREE steps so Kinovea trend matches Python visually:
            //   Step 1 — INVERT: multiply by -1 (Kinovea dot-product angle goes up when Python goes down)
            //   Step 2 — SHIFT:  add mean(Py) - mean(Kin_inverted)  → align zero-points
            //   Step 3 — SCALE:  multiply by std(Py)/std(Kin_shifted)  → match amplitude
            // Returns the adjusted array.  pyY and kinY may have different lengths.
            function normalizeKinoveaToBaseline(kinY, pyY) {
                if (!kinY || !pyY || kinY.length === 0 || pyY.length === 0) return kinY;

                // Step 1: Invert
                let inverted = kinY.map(v => -v);

                // Step 2: Shift (mean alignment)
                const len = Math.min(inverted.length, pyY.length);
                let sumKin = 0, sumPy = 0;
                for (let i = 0; i < len; i++) { sumKin += inverted[i]; sumPy += pyY[i]; }
                const meanKin = sumKin / len;
                const meanPy = sumPy / len;
                const shifted = inverted.map(v => v + (meanPy - meanKin));

                // Step 3: Scale amplitude  (std-based so outliers don't dominate)
                let varKin = 0, varPy = 0;
                for (let i = 0; i < len; i++) {
                    varKin += (shifted[i] - meanPy) ** 2;
                    varPy += (pyY[i] - meanPy) ** 2;
                }
                const stdKin = Math.sqrt(varKin / len);
                const stdPy = Math.sqrt(varPy / len);
                // Only scale if Kinovea has meaningful variation; guard div-by-zero
                const scale = (stdKin > 0.1) ? (stdPy / stdKin) : 1;
                // Cap scale factor to ×3 to avoid exploding the graph on noisy data
                const safeSc = Math.min(Math.max(scale, 0.1), 3.0);
                return shifted.map(v => meanPy + (v - meanPy) * safeSc);
            }

            // Kept as alias so old call-sites still compile during transition
            function alignKinoveaToBaseline(kinY, pyY) {
                return normalizeKinoveaToBaseline(kinY, pyY);
            }

            // Helper: compute min/max of an array for shared Y-axis range
            function arrRange(a) {
                if (!a || a.length === 0) return [0, 1];
                return [Math.min(...a), Math.max(...a)];
            }

            // === SHARED HELPER: Kinovea raw-coordinate → angle (degrees) ===
            // Works for any Kinovea semicolon-CSV row with columns:
            //   "Angle N/o/X", "Angle N/o/Y"  = origin point
            //   "Angle N/a/X", "Angle N/a/Y"  = arm A
            //   "Angle N/b/X", "Angle N/b/Y"  = arm B
            // Returns the unsigned angle (0-180°) between ray OA and ray OB,
            // or null if any coordinate is missing / zero-length.
            function computeKinoveaAngle(row, prefix) {
                let ox = row[`Angle ${prefix}/o/X`], oy = row[`Angle ${prefix}/o/Y`];
                let ax = row[`Angle ${prefix}/a/X`], ay = row[`Angle ${prefix}/a/Y`];
                let bx = row[`Angle ${prefix}/b/X`], by = row[`Angle ${prefix}/b/Y`];
                if (ox == null || ax == null || bx == null) return null;
                // Handle comma-as-decimal (European locale CSVs)
                [ox, oy, ax, ay, bx, by] = [ox, oy, ax, ay, bx, by].map(
                    v => typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v
                );
                const doax = ax - ox, doay = ay - oy;
                const dobx = bx - ox, doby = by - oy;
                const dot = doax * dobx + doay * doby;
                const magA = Math.sqrt(doax * doax + doay * doay);
                const magB = Math.sqrt(dobx * dobx + doby * doby);
                if (magA < 1e-9 || magB < 1e-9) return null;
                return Math.acos(Math.max(-1, Math.min(1, dot / (magA * magB)))) * 180 / Math.PI;
            }

            // Helper: parse Kinovea time (European comma-decimal → float, fallback to index*dt)
            function kinoveaTime(row, index, dt) {
                let t = row['Time'];
                if (typeof t === 'string') t = parseFloat(t.replace(',', '.'));
                return isNaN(t) ? index * dt : t;
            }

                // Responsive Line Width

                const subWidth = isMax ? lw * 0.5 : lw * 0.8;
                const mainWidth = subWidth; // Python same size as Kinovea

                // Helper function to calculate vertical positions using Forward Kinematics
                function calculateVerticalPositions(hipAngles, kneeAngles, timeData) {
                    const positions = {
                        time: timeData,
                        hip_y: [],
                        knee_y: [],
                        ankle_y: []
                    };

                    for (let i = 0; i < hipAngles.length; i++) {
                        // Convert angles to radians
                        const hipRad = hipAngles[i] * Math.PI / 180;
                        const kneeRad = kneeAngles[i] * Math.PI / 180;

                        // Hip position (assumed constant height or slight variation)
                        const hip_y = HIP_HEIGHT;

                        // Knee position (relative to hip)
                        const knee_y = hip_y - THIGH_LENGTH * Math.cos(hipRad);

                        // Ankle position (relative to knee)
                        // The ankle angle relative to vertical = hip angle - knee angle
                        const shankAngle = hipRad - kneeRad;
                        const ankle_y = knee_y - SHANK_LENGTH * Math.cos(shankAngle);

                        positions.hip_y.push(hip_y);
                        positions.knee_y.push(knee_y);
                        positions.ankle_y.push(ankle_y);
                    }

                    return positions;
                }

                // Helper to get Hip data with fallback
                function getHipData(dataset) {

                                for (let i = 0; i < len; i++) { sumPy += posPy.knee_y[i]; sumKin += posKinFull.knee_y[i]; }
                                let diff = (sumPy / len) - (sumKin / len);
                                let correction = diff * 0.95; // 95% Correction

                        line: { color: 'rgba(0,0,0,0.2)', width: 1, dash: 'dot' },
                        fill: 'tozeroy',
                        fillcolor: 'rgba(37, 99, 235, 0.1)' // Soft blue fill under the line
                    });

                    layout.xaxis.title = "Knee Angle (deg)";
                    layout.yaxis.title = "Cable Displacement (cm)";
                    layout.title = { text: "Cable Displacement vs Knee Angle", font: fontTitle, y: 0.95 };
                    layout.xaxis.dtick = 5;
                    layout.yaxis.dtick = 2;

                    // --- PULLEY MODEL DIAGRAM (Draggable Box) ---
                    // Annotation handled by SVG Overlay (diagram-knee-cable)
                }
            }
            Plotly.newPlot('plot-area', dataPlot, layout, config);
        }
        // === ORIENTATION CHANGE: Auto-resize Plotly chart ===
        window.addEventListener('orientationchange', function () {
            setTimeout(function () {
                drawPlot();
                Plotly.Plots.resize(document.getElementById('plot-area'));
            }, 300);
        });

        // Also listen to resize for desktop browser testing
        window.addEventListener('resize', function () {
            clearTimeout(window._resizeTimer);
            window._resizeTimer = setTimeout(function () {
                Plotly.Plots.resize(document.getElementById('plot-area'));
            }, 200);
        });
    </script>
</body>

</html>
